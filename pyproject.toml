# Advanced Video Automation System - UV Configuration

[project]
name = "video-automation"
version = "2.0.0"
description = "Advanced video automation system for viral YouTube Shorts"
requires-python = ">=3.8.1"
dependencies = [
    "opencv-python>=4.8.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth>=2.20.0",
    "requests>=2.31.0",
    "soundfile>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"